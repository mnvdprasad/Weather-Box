<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Weather Box</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0a0a25;
            color: rgb(251, 251, 251);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            
        }

        .weather-box {
            background: linear-gradient(135deg, #222269, #111136);
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            min-height: 350px;
            text-align: center;
            transition: background 0.5s ease, box-shadow 0.5s ease, color 0.5s ease;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .weather-box > * {
            position: relative;
            z-index: 2;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .weather-info > * {
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards;
        }

        .weather-info > *:nth-child(1) { animation-delay: 0.1s; }
        .weather-info > *:nth-child(2) { animation-delay: 0.2s; }
        .weather-info > *:nth-child(3) { animation-delay: 0.3s; }

        .weather-icon-container {
            opacity: 0;
            animation: fadeInUp 0.5s ease forwards 0.4s;
        }

        .weather-icon {
            width: 160px;
            height: 160px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .weather-box.clear-night .weather-icon,
        .weather-box.partly-cloudy-night .weather-icon,
        .weather-box.snow-night .weather-icon {
            filter: grayscale(100%) brightness(1.3) drop-shadow(0 10px 20px rgba(0,0,0,0.3));
        }

        .weather-box.clear-day {
            background: linear-gradient(135deg, #1b75eb, #6b92e1);
            color: #000;
        }

        .weather-box.cloudy-day,
        .weather-box.partly-cloudy-day {
            background: linear-gradient(135deg, #1b75eb, #6b92e1);
            color: #000;
        }

        .weather-box.overcast-day,
        .weather-box.rain-day,
        .weather-box.drizzle-day,
        .weather-box.hail-day,
        .weather-box.snow-day,
        .weather-box.fog-day {
            background: linear-gradient(135deg, #686d76, #979ba2);
            color: #000;
        }

        .weather-box.thunderstorm-day {
            background: linear-gradient(135deg, #4a5568, #2d3748);
        }

        .weather-box.clear-night {
            background: linear-gradient(135deg, #000000, #1a1a2e);
        }

        .weather-box.cloudy-night,
        .weather-box.partly-cloudy-night,
        .weather-box.overcast-night,
        .weather-box.rain-night,
        .weather-box.drizzle-night,
        .weather-box.hail-night,
        .weather-box.snow-night,
        .weather-box.fog-night {
            background: linear-gradient(135deg, #000000, #222222);
        }

        .weather-box.thunderstorm-night {
            background: linear-gradient(135deg, #0f0f11, #000000);
        }

        .weather-box.clear-night::before,
        .weather-box.clear-night::after,
        .weather-box.cloudy-night::before,
        .weather-box.cloudy-night::after,
        .weather-box.partly-cloudy-night::before,
        .weather-box.partly-cloudy-night::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30%;
            pointer-events: none;
            z-index: 1;
        }

        .weather-box.clear-night::before,
        .weather-box.cloudy-night::before,
        .weather-box.partly-cloudy-night::before {
            background: 
                radial-gradient(1px 1px at 10% 20%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 20% 80%, #f6f34d, transparent),
                radial-gradient(2px 2px at 35% 30%, #fff, transparent),
                radial-gradient(1px 1px at 50% 10%, #fff, transparent),
                radial-gradient(2px 2px at 65% 70%, #f6f34d, transparent),
                radial-gradient(1px 1px at 80% 40%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, #fff, transparent),
                radial-gradient(1px 1px at 95% 85%, #f6f34d, transparent);
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        .weather-box.clear-night::after,
        .weather-box.cloudy-night::after,
        .weather-box.partly-cloudy-night::after {
            background: 
                radial-gradient(1.5px 1.5px at 15% 50%, #fff, transparent),
                radial-gradient(1px 1px at 25% 15%, #fff, transparent),
                radial-gradient(2px 2px at 45% 80%, #fff, transparent),
                radial-gradient(1px 1px at 55% 40%, #f6f34d, transparent),
                radial-gradient(1.5px 1.5px at 75% 20%, #fff, transparent),
                radial-gradient(1px 1px at 85% 60%, #f6f34d, transparent),
                radial-gradient(2px 2px at 30% 90%, #fff, transparent),
                radial-gradient(1px 1px at 70% 90%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 40% 5%, #f6f34d, transparent);
            animation: twinkle 5s ease-in-out infinite alternate 1s;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .weather-box .cloud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 55%;
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
            background-repeat: repeat-x;
        }

        .cloud-layer.cloud-1 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/cloud-1.png');
            background-size: 250px;
            animation: moveClouds1 20s linear infinite;
        }

        .cloud-layer.cloud-2 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/cloud-2.png');
            background-size: 350px;
            animation: moveClouds2 35s linear infinite;
        }

        .weather-box.cloudy-day .cloud-layer.cloud-1,
        .weather-box.cloudy-night .cloud-layer.cloud-1,
        .weather-box.partly-cloudy-day .cloud-layer.cloud-1,
        .weather-box.partly-cloudy-night .cloud-layer.cloud-1 {
            opacity: 0.8;
        }

        .weather-box.cloudy-day .cloud-layer.cloud-2,
        .weather-box.cloudy-night .cloud-layer.cloud-2,
        .weather-box.partly-cloudy-day .cloud-layer.cloud-2,
        .weather-box.partly-cloudy-night .cloud-layer.cloud-2 {
            opacity: 0.5;
        }

        .weather-box .overcast-cloud-layer {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 50%;
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1s ease;
            background-repeat: repeat-x;
        }

        .overcast-cloud-layer.overcast-1 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/clouds_1.png');
            background-size: 350px;
            animation: moveOvercast1 50s linear infinite;
        }

        .overcast-cloud-layer.overcast-2 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/clouds_2.png');
            background-size: 450px;
            animation: moveOvercast2 45s linear infinite;
        }

        .overcast-cloud-layer.overcast-3 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/clouds_3.png');
            background-size: 550px;
            animation: moveOvercast3 40s linear infinite;
        }

        .weather-box.overcast-day .overcast-cloud-layer,
        .weather-box.overcast-night .overcast-cloud-layer,
        .weather-box.thunderstorm-day .overcast-cloud-layer,
        .weather-box.thunderstorm-night .overcast-cloud-layer,
        .weather-box.rain-day .overcast-cloud-layer,
        .weather-box.rain-night .overcast-cloud-layer,
        .weather-box.drizzle-day .overcast-cloud-layer,
        .weather-box.drizzle-night .overcast-cloud-layer,
        .weather-box.hail-day .overcast-cloud-layer,
        .weather-box.hail-night .overcast-cloud-layer,
        .weather-box.snow-day .overcast-cloud-layer,
        .weather-box.snow-night .overcast-cloud-layer {
            opacity: 0.85;
        }

        @keyframes moveClouds1 {
            0% { background-position: 0px 10px; }
            100% { background-position: -250px 10px; }
        }

        @keyframes moveClouds2 {
            0% { background-position: 0px 60px; }
            100% { background-position: -350px 60px; }
        }

        @keyframes moveOvercast1 {
            0% { background-position: 0px 0px; }
            100% { background-position: -350px 0px; }
        }

        @keyframes moveOvercast2 {
            0% { background-position: 0px 0px; }
            100% { background-position: -450px 0px; }
        }

        @keyframes moveOvercast3 {
            0% { background-position: 0px 0px; }
            100% { background-position: -550px 0px; }
        }

        .weather-box.rain-day .overcast-cloud-layer.overcast-1,
        .weather-box.rain-night .overcast-cloud-layer.overcast-1,
        .weather-box.drizzle-day .overcast-cloud-layer.overcast-1,
        .weather-box.drizzle-night .overcast-cloud-layer.overcast-1,
        .weather-box.hail-day .overcast-cloud-layer.overcast-1,
        .weather-box.hail-night .overcast-cloud-layer.overcast-1,
        .weather-box.snow-day .overcast-cloud-layer.overcast-1,
        .weather-box.snow-night .overcast-cloud-layer.overcast-1 {
            animation-duration: 150s;
        }

        .weather-box.rain-day .overcast-cloud-layer.overcast-2,
        .weather-box.rain-night .overcast-cloud-layer.overcast-2,
        .weather-box.drizzle-day .overcast-cloud-layer.overcast-2,
        .weather-box.drizzle-night .overcast-cloud-layer.overcast-2,
        .weather-box.hail-day .overcast-cloud-layer.overcast-2,
        .weather-box.hail-night .overcast-cloud-layer.overcast-2,
        .weather-box.snow-day .overcast-cloud-layer.overcast-2,
        .weather-box.snow-night .overcast-cloud-layer.overcast-2 {
            animation-duration: 120s;
        }

        .weather-box.rain-day .overcast-cloud-layer.overcast-3,
        .weather-box.rain-night .overcast-cloud-layer.overcast-3,
        .weather-box.drizzle-day .overcast-cloud-layer.overcast-3,
        .weather-box.drizzle-night .overcast-cloud-layer.overcast-3,
        .weather-box.hail-day .overcast-cloud-layer.overcast-3,
        .weather-box.hail-night .overcast-cloud-layer.overcast-3,
        .weather-box.snow-day .overcast-cloud-layer.overcast-3,
        .weather-box.snow-night .overcast-cloud-layer.overcast-3 {
            animation-duration: 100s;
        }

        .weather-box .lightning {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            opacity: 0;
            z-index: -1;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        }

        .lightning.lightning-1 {
            background: radial-gradient(circle at 30% 20%, rgba(227, 221, 163, 0.9) 0%, rgba(255, 240, 100, 0.4) 25%, transparent 60%);
        }

        .lightning.lightning-2 {
            background: radial-gradient(circle at 75% 30%, rgba(277, 221, 163, 0.9) 0%, rgba(255, 240, 100, 0.4) 25%, transparent 60%);
        }

        .weather-box.thunderstorm-day .lightning.lightning-1,
        .weather-box.thunderstorm-night .lightning.lightning-1 {
            animation: flash1 6s infinite;
        }

        .weather-box.thunderstorm-day .lightning.lightning-2,
        .weather-box.thunderstorm-night .lightning.lightning-2 {
            animation: flash2 8s infinite 2s;
        }

        @keyframes flash1 { 0%, 93%, 97%, 100% { opacity: 0; } 94%, 98% { opacity: 1; } 96% { opacity: 0.2; } }

        @keyframes flash2 { 0%, 90%, 94%, 100% { opacity: 0; } 91%, 95% { opacity: 1; } 93% { opacity: 0.2; } }

        .weather-box .rain-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            transition: opacity 1s ease;
        }

        .rain-layer.rain-1 {
            background-image: url("data:image/svg+xml,%3Csvg width='30' height='60' viewBox='0 0 30 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15 0 L10 20' stroke='rgba(255,255,255,0.4)' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E");
            background-size: 30px 60px;
        }

        .rain-layer.rain-2 {
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='40' viewBox='0 0 20 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 0 L6.25 15' stroke='rgba(255,255,255,0.25)' stroke-width='0.8' stroke-linecap='round'/%3E%3C/svg%3E");
            background-size: 20px 40px;
        }

        .rain-layer.rain-3 {
            background-image: url("data:image/svg+xml,%3Csvg width='15' height='30' viewBox='0 0 15 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7.5 0 L5 10' stroke='rgba(255,255,255,0.15)' stroke-width='0.5' stroke-linecap='round'/%3E%3C/svg%3E");
            background-size: 15px 30px;
        }

        .weather-box.rain-day .rain-layer,
        .weather-box.rain-night .rain-layer,
        .weather-box.drizzle-day .rain-layer,
        .weather-box.drizzle-night .rain-layer {
            opacity: 1;
        }

        .weather-box.rain-day .rain-layer.rain-1, .weather-box.rain-night .rain-layer.rain-1 { animation: rainFall1 0.8s linear infinite; }
        .weather-box.rain-day .rain-layer.rain-2, .weather-box.rain-night .rain-layer.rain-2 { animation: rainFall2 1.2s linear infinite; }
        .weather-box.rain-day .rain-layer.rain-3, .weather-box.rain-night .rain-layer.rain-3 { animation: rainFall3 1.6s linear infinite; }

        .weather-box.drizzle-day .rain-layer.rain-1, .weather-box.drizzle-night .rain-layer.rain-1 { animation: rainFall1 1.6s linear infinite; opacity: 0.6; }
        .weather-box.drizzle-day .rain-layer.rain-2, .weather-box.drizzle-night .rain-layer.rain-2 { animation: rainFall2 2.4s linear infinite; opacity: 0.4; }
        .weather-box.drizzle-day .rain-layer.rain-3, .weather-box.drizzle-night .rain-layer.rain-3 { animation: rainFall3 3.2s linear infinite; opacity: 0.2; }

        @keyframes rainFall1 { 0% { background-position: 0px 0px; } 100% { background-position: -30px 120px; } }
        @keyframes rainFall2 { 0% { background-position: 0px 0px; } 100% { background-position: -20px 80px; } }
        @keyframes rainFall3 { 0% { background-position: 0px 0px; } 100% { background-position: -15px 60px; } }

        .weather-box .hail-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 65%;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            transition: opacity 1s ease;
        }

        .hail-layer.hail-1 {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='2' fill='rgba(255,255,255,0.9)'/%3E%3Ccircle cx='5' cy='10' r='1.5' fill='rgba(255,255,255,0.8)'/%3E%3C/svg%3E");
            background-size: 40px 40px;
        }

        .hail-layer.hail-2 {
            background-image: url("data:image/svg+xml,%3Csvg width='30' height='30' viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='15' cy='15' r='1.5' fill='rgba(255,255,255,0.7)'/%3E%3Ccircle cx='25' cy='5' r='1' fill='rgba(255,255,255,0.6)'/%3E%3C/svg%3E");
            background-size: 30px 30px;
        }

        .hail-layer.hail-3 {
            background-image: url("data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='10' cy='10' r='1' fill='rgba(255,255,255,0.5)'/%3E%3Ccircle cx='2' cy='15' r='0.8' fill='rgba(255,255,255,0.4)'/%3E%3C/svg%3E");
            background-size: 20px 20px;
        }

        .weather-box.hail-day .hail-layer,
        .weather-box.hail-night .hail-layer {
            opacity: 1;
        }

        .weather-box.hail-day .hail-layer.hail-1, .weather-box.hail-night .hail-layer.hail-1 { animation: hailFall1 0.5s linear infinite; }
        .weather-box.hail-day .hail-layer.hail-2, .weather-box.hail-night .hail-layer.hail-2 { animation: hailFall2 0.7s linear infinite; }
        .weather-box.hail-day .hail-layer.hail-3, .weather-box.hail-night .hail-layer.hail-3 { animation: hailFall3 0.9s linear infinite; }

        @keyframes hailFall1 { 0% { background-position: 0px 0px; } 100% { background-position: -40px 120px; } }
        @keyframes hailFall2 { 0% { background-position: 0px 0px; } 100% { background-position: -30px 90px; } }
        @keyframes hailFall3 { 0% { background-position: 0px 0px; } 100% { background-position: -20px 60px; } }

        .weather-box .snow-layer {
            position: absolute;
            top: 0;
            left: -20px;
            width: calc(100% + 40px);
            height: 65%;
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 20%, black 40%, transparent 100%);
            transition: opacity 1s ease;
        }

        .snow-layer.snow-1 {
            background-image: url("data:image/svg+xml,%3Csvg width='50' height='50' viewBox='0 0 50 50' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M25 20v10M20 25h10M21.5 21.5l7 7M21.5 28.5l7-7' stroke='rgba(255,255,255,0.9)' stroke-width='1.2' stroke-linecap='round' fill='none'/%3E%3Cpath d='M10 12v6M7 15h6M7.9 12.9l4.2 4.2M7.9 17.1l4.2-4.2' stroke='rgba(255,255,255,0.7)' stroke-width='1' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
            background-size: 50px 50px;
        }

        .snow-layer.snow-2 {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 16.5v7M16.5 20h7M17.5 17.5l5 5M17.5 22.5l5-5' stroke='rgba(255,255,255,0.8)' stroke-width='1' stroke-linecap='round' fill='none'/%3E%3Cpath d='M5 27.5v5M2.5 30h5M3.2 28.2l3.6 3.6M3.2 31.8l3.6-3.6' stroke='rgba(255,255,255,0.6)' stroke-width='0.8' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
            background-size: 40px 40px;
        }

        .snow-layer.snow-3 {
            background-image: url("data:image/svg+xml,%3Csvg width='30' height='30' viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15 12.5v5M12.5 15h5M13.2 13.2l3.6 3.6M13.2 16.8l3.6-3.6' stroke='rgba(255,255,255,0.6)' stroke-width='0.8' stroke-linecap='round' fill='none'/%3E%3Cpath d='M25 3.5v3M23.5 5h3M23.9 3.9l2.2 2.2M23.9 6.1l2.2-2.2' stroke='rgba(255,255,255,0.4)' stroke-width='0.6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E");
            background-size: 30px 30px;
        }

        .weather-box.snow-day .snow-layer,
        .weather-box.snow-night .snow-layer {
            opacity: 1;
        }

        .weather-box.snow-day .snow-layer.snow-1, .weather-box.snow-night .snow-layer.snow-1 { animation: snowFall1 4s linear infinite, snowSway1 3s ease-in-out infinite alternate; }
        .weather-box.snow-day .snow-layer.snow-2, .weather-box.snow-night .snow-layer.snow-2 { animation: snowFall2 6s linear infinite, snowSway2 4s ease-in-out infinite alternate; }
        .weather-box.snow-day .snow-layer.snow-3, .weather-box.snow-night .snow-layer.snow-3 { animation: snowFall3 8s linear infinite, snowSway3 5s ease-in-out infinite alternate; }

        @keyframes snowFall1 { 0% { background-position: 0px 0px; } 100% { background-position: 0px 200px; } }
        @keyframes snowFall2 { 0% { background-position: 0px 0px; } 100% { background-position: 0px 160px; } }
        @keyframes snowFall3 { 0% { background-position: 0px 0px; } 100% { background-position: 0px 120px; } }

        @keyframes snowSway1 { 0% { transform: translateX(-15px); } 100% { transform: translateX(15px); } }
        @keyframes snowSway2 { 0% { transform: translateX(10px); } 100% { transform: translateX(-10px); } }
        @keyframes snowSway3 { 0% { transform: translateX(-8px); } 100% { transform: translateX(8px); } }

        .weather-box .fog-layer {
            position: absolute;
            top: 0;
            left: -10%;
            width: 120%;
            height: 85%;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
            transition: opacity 1s ease;
            background-repeat: repeat-x;
        }

        .fog-layer.fog-1 {
            background-image: url('https://cpripakezhdxkak1.public.blob.vercel-storage.com/clouds_1.png');
            background-size: 350px;
            filter: blur(10px);
            animation: fogMove1 35s linear infinite;
        }

        .fog-layer.fog-2 {

<body>

<div class="weather-box">
    <div class="lightning lightning-1"></div>
    <div class="lightning lightning-2"></div>
    <div class="rain-layer rain-1"></div>
    <div class="rain-layer rain-2"></div>
    <div class="rain-layer rain-3"></div>
    <div class="hail-layer hail-1"></div>
    <div class="hail-layer hail-2"></div>
    <div class="hail-layer hail-3"></div>
    <div class="snow-layer snow-1"></div>
    <div class="snow-layer snow-2"></div>
    <div class="snow-layer snow-3"></div>
    <div class="fog-layer fog-1"></div>
    <div class="fog-layer fog-2"></div>
    <div class="fog-layer fog-3"></div>
    <div class="cloud-layer cloud-1"></div>
    <div class="cloud-layer cloud-2"></div>
    <div class="overcast-cloud-layer overcast-1"></div>
    <div class="overcast-cloud-layer overcast-2"></div>
    <div class="overcast-cloud-layer overcast-3"></div>
    <h2>Weather Box <span class="author-text">by mnvd</span></h2>
    <p id="current-time"></p>
    <div class="search-container">
        <div class="input-group">
            <input type="text" id="city" placeholder="Enter city" autocomplete="off">
            <div id="suggestions-box" class="suggestions-box"></div>
            <div id="message-box" class="message-box"></div>
        </div>
        <button onclick="getWeather()">Search</button>
    </div>
    <div class="result" id="result"></div>
    <div id="forecast-wrapper">
        <div id="hourly-box" class="hourly-box">
            <div class="hourly-header" onclick="toggleForecast('hourly')"><i class='bx bx-time'></i> Hourly</div>
            <div id="hourly-container" class="hourly-container"></div>
        </div>
        <div id="daily-box" class="hourly-box">
            <div class="hourly-header" onclick="toggleForecast('daily')"><i class='bx bx-calendar'></i> Daily</div>
            <div id="daily-container" class="hourly-container"></div>
        </div>
    </div>
</div>

<script>
    let timeInterval;
    let weatherInterval;
    let debounceTimer;
    let currentFocus = -1;

    document.getElementById("city").addEventListener("focus", function() {
        document.getElementById("message-box").style.display = "none";
    });

    document.getElementById("city").addEventListener("input", function(e) {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        const suggestionsBox = document.getElementById("suggestions-box");
        currentFocus = -1;
        document.getElementById("message-box").style.display = "none";
        
        if (query.length < 2) {
            suggestionsBox.style.display = "none";
            return;
        }

        suggestionsBox.innerHTML = '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">Searching...</div>';
        suggestionsBox.style.display = "flex";

        debounceTimer = setTimeout(async () => {
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=20&language=en&format=json`);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    const uniqueResults = [];
                    const seenLocations = new Set();
                    
                    for (const city of data.results) {
                        const locationKey = `${city.name}-${city.admin1 || ''}-${city.country || ''}`;
                        if (!seenLocations.has(locationKey)) {
                            seenLocations.add(locationKey);
                            uniqueResults.push(city);
                            if (uniqueResults.length >= 5) break;
                        }
                    }

                    suggestionsBox.innerHTML = "";
                    uniqueResults.forEach(city => {
                        const item = document.createElement("div");
                        item.className = "suggestion-item";
                        const adminInfo = city.admin1 ? `${city.admin1}, ` : '';
                        const cityName = city.name;
                        const subName = `${adminInfo}${city.country}`;
                        
                        const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp(`(${safeQuery})`, "gi");
                        
                        const highlightedCity = cityName.replace(regex, "<strong>$1</strong>");
                        const highlightedSub = subName.replace(regex, "<strong>$1</strong>");
                        
                        item.innerHTML = `
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedCity}</div>
                            <div style="font-size: 0.65rem; opacity: 0.7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedSub}</div>
                        `;
                        
                        item.onclick = () => {
                            document.getElementById("city").value = city.name;
                            suggestionsBox.style.display = "none";
                            getWeather();
                        };
                        suggestionsBox.appendChild(item);
                    });
                } else {
                    suggestionsBox.innerHTML = '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">No results found</div>';
                }
            } catch (error) {
                console.error("Error fetching suggestions", error);
                suggestionsBox.innerHTML = '<div class="suggestion-item" style="opacity: 0.7; cursor: default; color: #ffcccc;">Error loading suggestions</div>';
            }
        }, 50);
    });

    document.addEventListener("click", function(e) {
        if (!e.target.closest('.search-container')) {
            const suggestionsBox = document.getElementById("suggestions-box");
            if (suggestionsBox) suggestionsBox.style.display = "none";
        }
    });

    document.getElementById("city").addEventListener("keydown", function(e) {
        const suggestionsBox = document.getElementById("suggestions-box");
        let items = suggestionsBox.getElementsByClassName("suggestion-item");
        
        if (e.key === "ArrowDown") {
            e.preventDefault();
            currentFocus++;
            addActive(items);
        } else if (e.key === "ArrowUp") {
            e.preventDefault();
            currentFocus--;
            addActive(items);
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (suggestionsBox.style.display === "flex" && currentFocus > -1) {
                if (items[currentFocus] && items[currentFocus].onclick) {
                    items[currentFocus].click();
                }
            } else {
                getWeather();
            }
        }
    });

    function addActive(items) {
        if (!items || items.length === 0 || !items[0].onclick) return;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("active");
    }

    function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
            items[i].classList.remove("active");
        }
    }

    function toggleForecast(type) {
        const hourlyContainer = document.getElementById('hourly-container');
        const dailyContainer = document.getElementById('daily-container');
        if (type === 'hourly') {
            if (dailyContainer.classList.contains('show')) dailyContainer.classList.remove('show');
            hourlyContainer.classList.toggle('show');
        } else {
            if (hourlyContainer.classList.contains('show')) hourlyContainer.classList.remove('show');
            dailyContainer.classList.toggle('show');
        }
    }

    function showMessage(message) {
        const msgBox = document.getElementById('message-box');
        msgBox.innerHTML = `<i class='bx bx-error-circle' style='font-size: 1.1rem; margin-right: 5px; vertical-align: -2px;'></i> ${message}`;
        msgBox.style.display = 'block';
    }

    function startClock(timezoneOffset) {
        if (timeInterval) clearInterval(timeInterval);


        const update = () => {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const cityTime = new Date(utc + (1000 * timezoneOffset));
            
            const day = cityTime.getDate();
            const month = cityTime.toLocaleString('default', { month: 'short' });
            let hours = cityTime.getHours();
            const minutes = cityTime.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            
            const timeString = `${day} ${month} ${hours.toString().padStart(2, '0')}:${minutes} ${ampm}`;
            const timeEl = document.getElementById("city-time");
            if (timeEl) timeEl.innerText = timeString;
        };
        update();
        timeInterval = setInterval(update, 1000);
    }

    async function getWeather(isAutoUpdate = false) {
        const cityInput = document.getElementById("city").value.trim();
        const city = cityInput.toLowerCase();
        const result = document.getElementById("result");
        const forecastWrapper = document.getElementById("forecast-wrapper");
        const hourlyContainer = document.getElementById("hourly-container");
        const dailyContainer = document.getElementById("daily-container");
        const messageBox = document.getElementById("message-box");
        const suggestionsBox = document.getElementById("suggestions-box");
        
        if (suggestionsBox) suggestionsBox.style.display = "none";

        // Start of temporary code for testing animations
        const testAnimations = {
            "sunny": { class: "clear-day", icon: "day", condition: "Clear Sky" },
            "clear night": { class: "clear-night", icon: "night", condition: "Clear Sky" },
            "cloudy day": { class: "partly-cloudy-day", icon: "cloudy-day-1", condition: "Partly Cloudy" },
            "cloudy night": { class: "partly-cloudy-night", icon: "cloudy-night-1", condition: "Partly Cloudy" },
            "overcast day": { class: "overcast-day", icon: "cloudy", condition: "Overcast" },
            "overcast night": { class: "overcast-night", icon: "cloudy", condition: "Overcast" },
            "rain day": { class: "rain-day", icon: "rainy-6", condition: "Rain" },
            "rain night": { class: "rain-night", icon: "rainy-6", condition: "Rain" },
            "drizzle day": { class: "drizzle-day", icon: "rainy-1", condition: "Drizzle" },
            "drizzle night": { class: "drizzle-night", icon: "rainy-1", condition: "Drizzle" },
            "thunder day": { class: "thunderstorm-day", icon: "thunder", condition: "Thunderstorm" },
            "thunder night": { class: "thunderstorm-night", icon: "thunder", condition: "Thunderstorm" },

                77: "snowy-6",
                80: "rainy-6", 81: "rainy-6", 82: "rainy-6",
                85: "snowy-6", 86: "snowy-6",
                95: "thunder", 96: "thunder", 99: "thunder"
            };

            for (let i = currentHour + 1; i <= currentHour + 12; i++) {
                if (i >= uvData.hourly.time.length) break;
                
                const timeStr = uvData.hourly.time[i];
                const dateObj = new Date(timeStr);
                let h = dateObj.getHours();
                const ampm = h >= 12 ? 'pm' : 'am';
                h = h % 12;
                h = h ? h : 12;
                const displayTime = `${h} ${ampm}`;
                
                const hTemp = Math.round(uvData.hourly.temperature_2m[i]);
                const hPop = uvData.hourly.precipitation_probability[i];
                const hCode = uvData.hourly.weather_code[i];
                const hIcon = wmoIconMap[hCode] || "day";
                const hIconSrc = `https://www.amcharts.com/wp-content/themes/amcharts4/css/img/icons/weather/animated/${hIcon}.svg`;

                hourlyHTML += `<div class="hourly-card"><div class="hourly-time">${displayTime}</div><img src="${hIconSrc}" class="hourly-icon-img"><div class="hourly-temp">${hTemp}°</div><div class="hourly-sub">💧 ${hPop}%</div></div>`;
            }
            hourlyHTML += '</div>';
            hourlyContainer.innerHTML = hourlyHTML;

            let dailyHTML = '<div class="hourly-scroll">';
            for (let i = 1; i <= 6; i++) {
                if (i >= uvData.daily.time.length) break;
                
                const timeStr = uvData.daily.time[i];
                const dateParts = timeStr.split('-');
                const dateObj = new Date(dateParts[0], dateParts[1] - 1, dateParts[2]);
                const dayStr = dateObj.getDate();
                const weekdayStr = dateObj.toLocaleString('default', { weekday: 'short' });
                const displayDate = `${dayStr}, ${weekdayStr}`;
                
                const dTemp = Math.round(uvData.daily.temperature_2m_max[i]);
                const dPop = uvData.daily.precipitation_probability_max[i];
                const dCode = uvData.daily.weather_code[i];
                const dIcon = wmoIconMap[dCode] || "day";
                const dIconSrc = `https://www.amcharts.com/wp-content/themes/amcharts4/css/img/icons/weather/animated/${dIcon}.svg`;

                dailyHTML += `<div class="hourly-card"><div class="hourly-time">${displayDate}</div><img src="${dIconSrc}" class="hourly-icon-img"><div class="hourly-temp">${dTemp}°</div><div class="hourly-sub">💧 ${dPop}%</div></div>`;
            }
            dailyHTML += '</div>';
            dailyContainer.innerHTML = dailyHTML;

            forecastWrapper.style.display = 'block';

            if (weatherInterval) clearTimeout(weatherInterval);
            weatherInterval = setTimeout(() => getWeather(true), 300000); // Refresh interval 5 minutes

        } catch (error) {
            if (!isAutoUpdate) {
                result.innerHTML = "";
                showMessage(error.message);
            }
        }
    }
</script>

</body>
</html>

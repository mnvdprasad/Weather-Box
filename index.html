<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Box | Real-Time Weather Forecast & Updates</title>
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&display=swap");

      /* Self-Hosted Custom Fonts */
      @font-face {
        font-family: "LocalImpact";
        src: url("assets/fonts/impact.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "LocalBrushScript";
        src: url("assets/fonts/brushsci.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "LocalComicSans";
        src: url("assets/fonts/comic.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "LocalLato";
        src: url("assets/fonts/Lato-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "LocalMerriweatherSans";
        src: url("assets/fonts/MerriweatherSans-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "LocalPacifico";
        src: url("assets/fonts/Pacifico-Regular.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      /* Base body styling: dark theme, centered flex layout, full viewport height */
      body {
        font-family: Arial, sans-serif;
        background-color: #0a0a25;
        color: rgb(251, 251, 251);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding-top: 10px;
        padding-bottom: 10px;
        box-sizing: border-box;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-behavior: smooth;
      }
      h2 {
        margin-top: 0;
        margin-bottom: 0;
      }
      #current-time {
        margin-top: 0;
        margin-bottom: 5px;
        font-size: 0.7rem;
      }

      /* Helper to handle overflowing text with an ellipsis (...) */
      .ellipsis-text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ==================== MAIN LAYOUT ==================== */
      /* The primary container for the weather widget, styling its size, background, and centering */
      .weather-box {
        background:
          linear-gradient(
            to bottom,
            rgba(0, 0, 0, 0) 125px,
            #172554 250px,
            #1e3a8a 600px
          ),
          url("assets/images/monsoon-startup.webp") no-repeat top center / 100%
            250px,
          linear-gradient(135deg, #172554, #1e3a8a);
        padding: 12px;
        border-radius: 10px;
        width: 350px;
        min-height: 680px;
        height: auto;
        text-align: center;
        transition:
          background 0.5s ease,
          box-shadow 0.5s ease,
          color 0.5s ease;
        position: relative;
        overflow-x: hidden;
        overflow-y: hidden;
        z-index: 1;
        margin-top: 0px;
        margin-bottom: 0px;
        transform-origin: top center;
      }

      /* Custom scrollbar styling for Webkit browsers */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.6);
      }

      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
      }

      /* Ensure direct children of weather-box are positioned above the background layers */
      .weather-box > * {
        position: relative;
        z-index: 2;
      }

      .weatherbox-title {
        font-family:
          "LocalBrushScript", "Brush Script MT", "Brush Script std", cursive;
        letter-spacing: 1.3px;
        color: transparent;
        background-image: linear-gradient(
          135deg,
          #f5f5f5 0%,
          #b8b8b8 10%,
          #9d9d9d 18%,
          #ffffff 27%,
          #8f8f8f 38%,
          #d6d6d6 48%,
          #919191 58%,
          #f0f0f0 68%,
          #878787 79%,
          #cfcfcf 89%,
          #ffffff 100%
        );
        background-size: 105% 105%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: contrast(115%) brightness(108%) invert(1)
          drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px #fff)
          drop-shadow(0 0 15px #fff);
      }

      .weather-box.about-mode .weatherbox-title,
      .weather-box.clear-day .weatherbox-title,
      .weather-box.clear-night .weatherbox-title,
      .weather-box.fog-night .weatherbox-title {
        filter: contrast(115%) brightness(108%);
      }

      .author-text {
        font-size: 0.65rem;
        font-weight: normal;
        opacity: 0.7;
        font-family:
          "LocalBrushScript", "Brush Script MT", "Brush Script Std", cursive;
        color: #fff;
        letter-spacing: 0.5px;
        filter: contrast(115%) brightness(108%) invert(1)
          drop-shadow(0 0 2px #fff) drop-shadow(0 0 8px #fff)
          drop-shadow(0 0 15px #fff);
      }

      .weather-box.about-mode .author-text,
      .weather-box.clear-day .author-text,
      .weather-box.clear-night .author-text,
      .weather-box.fog-night .author-text {
        color: #fff;
        filter: invert(0);
      }

      /* ==================== SEARCH & INPUT ==================== */
      /* Styling for the location, search bar, button, and autocomplete suggestions */
      .search-container {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        z-index: 20;
        align-items: center;
      }

      .input-group {
        flex: 1;
        position: relative;
        display: flex;
      }

      input {
        flex: 1;
        padding: 6px 8px;
        margin-bottom: 0;
        border-radius: 5px;
        border: none;
        outline: none;
        background-color: rgba(200, 200, 200, 0.85);
        color: #505050;
        box-shadow:
          0 0 8px rgba(255, 255, 255, 0.6),
          0 0 15px rgba(255, 255, 255, 0.4);
        transition: box-shadow 0.3s ease;
      }

      input:focus {
        box-shadow:
          0 0 12px rgba(255, 255, 255, 0.8),
          0 0 20px rgba(255, 255, 255, 0.6);
      }

      .weather-box.overcast-day input,
      .weather-box.drizzle-day input,
      .weather-box.rain-day input,
      .weather-box.moderate-rain-day input,
      .weather-box.heavy-rain-day input,
      .weather-box.extreme-rain-day input,
      .weather-box.hail-day input,
      .weather-box.snow-day input,
      .weather-box.light-snow-day input,
      .weather-box.heavy-snow-day input,
      .weather-box.rain-snow-day input,
      .weather-box.fog-day input,
      .weather-box.thunderstorm-day input,
      .weather-box.thunderstorm-rain-day input,
      .weather-box.severe-thunderstorm-day input,
      .weather-box.overcast-night input,
      .weather-box.drizzle-night input,
      .weather-box.rain-night input,
      .weather-box.moderate-rain-night input,
      .weather-box.heavy-rain-night input,
      .weather-box.extreme-rain-night input,
      .weather-box.hail-night input,
      .weather-box.snow-night input,
      .weather-box.light-snow-night input,
      .weather-box.heavy-snow-night input,
      .weather-box.rain-snow-night input,
      .weather-box.thunderstorm-night input,
      .weather-box.thunderstorm-rain-night input,
      .weather-box.severe-thunderstorm-night input {
        background-color: rgba(55, 55, 55, 0.85);
        color: #d2d2d2;
      }

      button {
        padding: 6px 15px;
        color: #1f2937;
        font-family: "LocalMerriweatherSans", "Merriweather Sans", sans-serif;
        cursor: pointer;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0)
        );
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }

      .weather-box.clear-night button,
      .weather-box.partly-cloudy-night button,
      .weather-box.fog-night button {
        color: #bebebe;
      }

      button:hover {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.2),
          rgba(255, 255, 255, 0.1)
        );
      }

      #location-btn {
        background: transparent;
        border: none;
        color: #999999;
        box-shadow: none;
        padding: 0 8px;
        margin-left: -14px;
        margin-right: -14px;
        outline: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
        transition: transform 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .weather-box.clear-day #location-btn,
      .weather-box.partly-cloudy-day #location-btn,
      .weather-box.cloudy-day #location-btn,
      .weather-box.overcast-day #location-btn,
      .weather-box.drizzle-day #location-btn,
      .weather-box.rain-day #location-btn,
      .weather-box.moderate-rain-day #location-btn,
      .weather-box.heavy-rain-day #location-btn,
      .weather-box.extreme-rain-day #location-btn,
      .weather-box.hail-day #location-btn,
      .weather-box.snow-day #location-btn,
      .weather-box.light-snow-day #location-btn,
      .weather-box.heavy-snow-day #location-btn,
      .weather-box.rain-snow-day #location-btn,
      .weather-box.fog-day #location-btn,
      .weather-box.thunderstorm-day #location-btn,
      .weather-box.thunderstorm-rain-day #location-btn,
      .weather-box.severe-thunderstorm-day #location-btn,
      .weather-box.overcast-night #location-btn,
      .weather-box.drizzle-night #location-btn,
      .weather-box.rain-night #location-btn,
      .weather-box.moderate-rain-night #location-btn,
      .weather-box.heavy-rain-night #location-btn,
      .weather-box.extreme-rain-night #location-btn,
      .weather-box.hail-night #location-btn,
      .weather-box.snow-night #location-btn,
      .weather-box.light-snow-night #location-btn,
      .weather-box.heavy-snow-night #location-btn,
      .weather-box.rain-snow-night #location-btn,
      .weather-box.thunderstorm-night #location-btn,
      .weather-box.thunderstorm-rain-night #location-btn,
      .weather-box.severe-thunderstorm-night #location-btn {
        color: #111111;
      }

      #location-btn:hover {
        background: transparent;
        transform: scale(1.1);
      }

      @keyframes pinTada {
        0% {
          transform: scale(1);
        }
        10%,
        20% {
          transform: scale(0.9) rotate(-8deg);
        }
        30%,
        50%,
        70%,
        90% {
          transform: scale(1.1) rotate(8deg);
        }
        40%,
        60%,
        80% {
          transform: scale(1.1) rotate(-8deg);
        }
        100% {
          transform: scale(1);
        }
      }

      .location-svg {
        overflow: visible;
      }

      .location-pin {
        transform-origin: 50% 50%;
      }

      .loading-tada .location-pin {
        animation: pinTada 1s ease infinite;
      }

      /* Dropdown box for search suggestions */
      @keyframes slideDownSuggestions {
        from { opacity: 0; transform: translateY(-10px) scaleY(0.95); transform-origin: top; }
        to { opacity: 1; transform: translateY(0) scaleY(1); transform-origin: top; }
      }
      @keyframes slideUpSuggestions {
        from { opacity: 1; transform: translateY(0) scaleY(1); transform-origin: top; }
        to { opacity: 0; transform: translateY(-10px) scaleY(0.95); transform-origin: top; }
      }
      
      .suggestions-box {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        margin-top: 2px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.1),
          rgba(255, 255, 255, 0.05)
        );
        -webkit-backdrop-filter: blur(10px) brightness(0.7);
        backdrop-filter: blur(10px) brightness(0.7);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        border-radius: 8px;
        z-index: 20;
        display: none;
        flex-direction: column;
        overflow-y: auto;
        max-height: 185px;
      }
      
      .suggestions-box.s-open {
        animation: slideDownSuggestions 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        display: flex !important;
      }
      
      .suggestions-box.s-closing {
        animation: slideUpSuggestions 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        display: flex !important;
      }
      .suggestions-box::-webkit-scrollbar {
        width: 4px;
      }
      .suggestions-box::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }

      .suggestion-item {
        padding: 6px 12px;
        cursor: pointer;
        text-align: left;
        font-size: 0.85rem;
        font-family: "LocalMerriweatherSans", "Merriweather Sans", sans-serif;
        transition: background 0.2s;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.9);
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex-shrink: 0;
      }
      .suggestion-item:hover,
      .suggestion-item.active {
        background: rgba(255, 255, 255, 0.15);
      }
      .suggestion-item strong {
        color: #fff;
        font-weight: 700;
      }

      .message-box {
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        box-sizing: border-box;
        border-radius: 10px;
        background: linear-gradient(
          135deg,
          rgba(255, 70, 70, 0.2),
          rgba(255, 50, 50, 0.05)
        );
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 120, 120, 0.3);
        box-shadow: 0 8px 32px 0 rgba(200, 0, 0, 0.2);
        color: #fff;
        font-size: 0.9rem;
        display: none;
        z-index: 10;
        animation: zoomOutIn 0.3s ease forwards;
      }

      .message-box::before {
        content: "";
        position: absolute;
        top: -8px;
        left: 20px;
        width: 18px;
        height: 18px;
        margin-top: -2px;
        background: linear-gradient(
          135deg,
          rgba(255, 70, 70, 0.2),
          rgba(255, 50, 50, 0.15)
        );
        border-top: 1px solid rgba(255, 120, 120, 0.3);
        border-left: 1px solid rgba(255, 120, 120, 0.3);
        transform: rotate(45deg);
        border-radius: 4px 0 0 0;
        clip-path: polygon(0 0, 100% 0, 0 100%);
      }
    </style>

  <body>
    <!-- Main wrapper for the entire application, handles overall scaling and background theme -->

      ></div>

      <h2>
        <span class="weatherbox-title">Weather Box</span>

      <!-- Search bar area: current location button, text input, suggestions dropdown, search button -->
      <div class="search-container">
        <button id="location-btn" title="Current Location">
          <svg

            ></path>
            <path
              fill="currentColor"

      <!-- Main container where weather data (current, forecast, details) will be injected dynamically -->
      <div class="result" id="result"></div>

      <!-- About Us Panel Overlay -->

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (localStorage.getItem("rememberCity") === "true") {
          const lastCity = localStorage.getItem("lastCity");
          if (lastCity) {
            const cityInput = document.getElementById("city");
            if (cityInput) cityInput.value = lastCity;
            currentStartupCity = lastCity;
            fetchStartupCityWeather();
          } else {
            showRandomStartupCity();
          }
        } else {
          showRandomStartupCity();
        }

        const weatherBox = document.querySelector(".weather-box");
        if (weatherBox) {
          let roTimer;
          new ResizeObserver(() => {
            if (roTimer) clearTimeout(roTimer);
            roTimer = setTimeout(() => {
              const match = weatherBox.style.transform.match(/scale\(([^)]+)\)/);
              const scale = match ? parseFloat(match[1]) : 1;
              const visualDiff = weatherBox.offsetHeight * scale - weatherBox.offsetHeight;
              weatherBox.style.marginBottom = `${visualDiff}px`;
            }, 150);
          }).observe(weatherBox);
        }

        let resizeTimer;
        window.addEventListener("resize", () => {
          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(adjustZoom, 150);
        });
        setTimeout(adjustZoom, 100);

        const locationBtn = document.getElementById("location-btn");
        if (locationBtn) {
          locationBtn.addEventListener("click", useCurrentLocation);
        }

        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) {
          searchBtn.addEventListener("click", function () {
            getWeather();
          });
        }
      });

      document.getElementById("city").addEventListener("focus", function () {
        if (startupInterval) clearInterval(startupInterval);
        document.getElementById("message-box").style.display = "none";
      });

      /* Event listener for the city search input. Fetches autocomplete suggestions from OpenStreetMap, Open-Meteo, and OpenWeatherMap based on user input. */
      document.getElementById("city").addEventListener("input", function (e) {
        if (startupInterval) clearInterval(startupInterval);
        window.selectedLocation = null;
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        const suggestionsBox = document.getElementById("suggestions-box");
        currentFocus = -1;
        document.getElementById("message-box").style.display = "none";

        if (query.length < 2) {
          suggestionsBox.style.display = "none";
          return;
        }

        if (!navigator.onLine) {
          suggestionsBox.innerHTML =
            '<div class="suggestion-item" style="opacity: 0.7; cursor: default; color: #ffcccc;">No internet connection</div>';
          suggestionsBox.style.display = "flex";
          return;
        }

        debounceTimer = setTimeout(async () => {
          if (query.length < 4) {
            suggestionsBox.innerHTML =
              '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">Searching...</div>';
          }
          suggestionsBox.style.display = "flex";

          try {
            let isZip = /\d/.test(query);
            const promises = [
              fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=5`),
              isZip ? Promise.resolve({ ok: false, status: "skipped" }) : fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5`),
              fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=5&language=en&format=json`),
              fetch(`/api/weather?action=geo_direct&q=${encodeURIComponent(query)}&limit=5`),
              isZip ? fetch(`/api/weather?action=geo_zip&zip=${encodeURIComponent(query)}`) : Promise.resolve({ ok: false, status: "skipped" })
            ];

            const [nomRes, photonRes, omRes, owmRes, owmZipRes] =
              await Promise.allSettled(promises);

            const uniqueResults = [];
            const seenLocations = new Set();

            const addResult = (
              cityName,
              district,
              admin1,
              country,
              lat,
              lon,
              fullAddress,
            ) => {
              let safeCity = (cityName || "Unknown")
                .replace(/[0-9]/g, "")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              if (!safeCity || safeCity.toLowerCase() === "unknown") return;

              let safeDistrict = (district || "")
                .replace(/[0-9]/g, "")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              let safeAdmin = (admin1 || "")
                .replace(/[0-9]/g, "")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              let safeCountry = country || "";

              if (safeCountry.length === 2) {
                try {
                  const regionNames = new Intl.DisplayNames(["en"], {
                    type: "region",
                  });
                  safeCountry =
                    regionNames.of(safeCountry.toUpperCase()) || safeCountry;
                } catch (e) {}
              }

              let resolvedFullAddr =
                fullAddress ||
                [safeCity, safeDistrict, safeAdmin, safeCountry]
                  .filter(Boolean)
                  .join(",<br>");

              const locationKey = `${safeCity.toLowerCase()}-${(parseFloat(lat) || 0).toFixed(1)}-${(parseFloat(lon) || 0).toFixed(1)}`;

              if (!seenLocations.has(locationKey)) {
                seenLocations.add(locationKey);
                uniqueResults.push({
                  name: safeCity,
                  district: safeDistrict,
                  admin1: safeAdmin,
                  country: safeCountry,
                  lat: lat,
                  lon: lon,
                  fullAddress: resolvedFullAddr,
                });
              }
            };

            if (nomRes.status === "fulfilled" && nomRes.value.ok !== false) {
              const nomData = await nomRes.value.json();
              if (nomData && nomData.length) {
                nomData.forEach((city) => {
                  let cName = city.name;
                  if (!cName || /\d/.test(cName)) {
                    cName = city.address
                      ? city.address.village ||
                        city.address.town ||
                        city.address.city ||
                        city.address.hamlet ||
                        city.address.suburb
                      : "";
                  }
                  if (!cName && city.display_name) {
                    const parts = city.display_name.split(",");
                    const textParts = parts
                      .map((p) => p.trim())
                      .filter((p) => !/\d/.test(p));
                    cName = textParts.length > 0 ? textParts[0] : "Unknown";
                  }
                  const cAdmin = city.address
                    ? city.address.state ||
                      city.address.county ||
                      city.address.region ||
                      ""
                    : "";
                  const cCountry = city.address
                    ? city.address.country || ""
                    : "";

                  let parts = [cName];
                  let district = "";
                  if (city.address) {
                    let addr = city.address;
                    let mandal =
                      addr.county || addr.municipality || addr.suburb || "";
                    district = addr.state_district || addr.district || "";
                    let state = addr.state || addr.region || "";
                    let postcode = addr.postcode || "";
                    let country = addr.country || "";

                    if (mandal && !parts.includes(mandal)) parts.push(mandal);
                    if (district && !parts.includes(district))
                      parts.push(district);
                    if (state && !parts.includes(state)) {
                      parts.push(postcode ? `${state} ${postcode}` : state);
                    } else if (postcode && !parts.includes(postcode)) {
                      parts.push(postcode);
                    }
                    if (country && !parts.includes(country))
                      parts.push(country);
                  }
                  let fullAddr = parts.filter(Boolean).join(",<br>");
                  addResult(
                    cName,
                    district,
                    cAdmin,
                    cCountry,
                    city.lat,
                    city.lon,
                    fullAddr,
                  );
                });
              }
            }

            if (
              photonRes &&
              photonRes.status === "fulfilled" &&
              photonRes.value.ok !== false
            ) {
              if (photonRes.value.status !== "skipped") {
                const photonData = await photonRes.value.json();
                if (
                  photonData &&
                  photonData.features &&
                  photonData.features.length
                ) {
                  photonData.features.forEach((feature) => {
                    let props = feature.properties;
                    if (!props.name) return;
                    let cName = props.name;
                    let cAdmin = props.state || props.county || "";
                    let cCountry = props.country || "";
                    if (!feature.geometry || !feature.geometry.coordinates)
                      return;
                    let lat = feature.geometry.coordinates[1];
                    let lon = feature.geometry.coordinates[0];

                    let parts = [cName];
                    if (props.district && !parts.includes(props.district))
                      parts.push(props.district);
                    if (cAdmin && !parts.includes(cAdmin)) parts.push(cAdmin);
                    if (cCountry && !parts.includes(cCountry))
                      parts.push(cCountry);

                    let fullAddr = parts.filter(Boolean).join(",<br>");
                    let district = props.district || "";
                    addResult(
                      cName,
                      district,
                      cAdmin,
                      cCountry,
                      lat,
                      lon,
                      fullAddr,
                    );
                  });
                }
              }
            }

            if (omRes.status === "fulfilled" && omRes.value.ok !== false) {
              const omData = await omRes.value.json();
              if (omData.results && omData.results.length) {
                omData.results.forEach((city) => {
                  let parts = [city.name];
                  let mandal = city.admin3 || city.admin4 || "";
                  let district = city.admin2 || "";
                  let state = city.admin1 || "";
                  let postcode =
                    city.postcodes && city.postcodes.length > 0
                      ? city.postcodes[0]
                      : "";
                  let countryFull = city.country || "";

                  if (mandal && !parts.includes(mandal)) parts.push(mandal);
                  if (district && !parts.includes(district))
                    parts.push(district);
                  if (state && !parts.includes(state)) {
                    parts.push(postcode ? `${state} ${postcode}` : state);
                  } else if (postcode && !parts.includes(postcode)) {
                    parts.push(postcode);
                  }
                  if (countryFull && !parts.includes(countryFull))
                    parts.push(countryFull);
                  let fullAddr = parts.filter(Boolean).join(",<br>");
                  addResult(
                    city.name,
                    district,
                    city.admin1,
                    city.country || city.country_code,
                    city.latitude,
                    city.longitude,
                    fullAddr,
                  );
                });
              }
            }

            if (owmRes.status === "fulfilled" && owmRes.value.ok !== false) {
              const owmData = await owmRes.value.json();
              if (owmData && owmData.length) {
                owmData.forEach((city) => {
                  let countryFull = city.country || "";
                  if (countryFull && countryFull.length === 2) {
                    try {
                      const regionNames = new Intl.DisplayNames(["en"], {
                        type: "region",
                      });
                      countryFull =
                        regionNames.of(countryFull.toUpperCase()) ||
                        countryFull;
                    } catch (e) {}
                  }
                  let parts = [city.name];
                  if (city.state && !parts.includes(city.state))
                    parts.push(city.state);
                  if (countryFull && !parts.includes(countryFull))
                    parts.push(countryFull);
                  let fullAddr = parts.filter(Boolean).join(",<br>");
                  addResult(
                    city.name,
                    "",
                    city.state,
                    city.country,
                    city.lat,
                    city.lon,
                    fullAddr,
                  );
                });
              }
            }

            if (
              owmZipRes &&
              owmZipRes.status === "fulfilled" &&
              owmZipRes.value.ok !== false
            ) {
              const owmZipData = await owmZipRes.value.json();
              if (owmZipData && owmZipData.name) {
                let countryFull = owmZipData.country || "";
                if (countryFull && countryFull.length === 2) {
                  try {
                    const regionNames = new Intl.DisplayNames(["en"], {
                      type: "region",
                    });
                    countryFull =
                      regionNames.of(countryFull.toUpperCase()) || countryFull;
                  } catch (e) {}
                }
                let fullAddr = [owmZipData.name, query, countryFull]
                  .filter(Boolean)
                  .join(",<br>");
                addResult(
                  owmZipData.name,
                  "",
                  "",
                  owmZipData.country,
                  owmZipData.lat,
                  owmZipData.lon,
                  fullAddr,
                );
              }
            }

            if (uniqueResults.length > 0) {
              suggestionsBox.innerHTML = "";
              uniqueResults.forEach((city, index) => {
                const suggestionItem = document.createElement("div");
                suggestionItem.className = "suggestion-item";

                const adminInfo = city.admin1 ? `${city.admin1}, ` : "";
                const districtInfo =
                  city.district &&
                  city.district !== city.name &&
                  city.district !== city.admin1
                    ? `${city.district}, `
                    : "";
                const cityName = city.name;
                const subName = `${districtInfo}${adminInfo}${city.country}`;

                const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                const regex = new RegExp(`(${safeQuery})`, "gi");

                const highlightedCity = cityName.replace(
                  regex,
                  "<strong>$1</strong>",
                );
                const highlightedSub = subName.replace(
                  regex,
                  "<strong>$1</strong>",
                );

                suggestionItem.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 6px;">
                            <i class="ti ti-map-pin-search" style="margin-top: -9px; flex-shrink: 0;"></i>
                            <div style="display: flex; flex-direction: column; min-width: 0;">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedCity}</div>
                            <div style="font-size: 0.55rem; opacity: 0.7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedSub}</div></div></div>
                        `;

                suggestionItem.addEventListener("click", () => {
                  document.getElementById("city").value = city.name;
                  suggestionsBox.style.display = "none";
                  window.selectedLocation = {
                    lat: city.lat,
                    lon: city.lon,
                    name: city.name,
                    country: city.country,
                    fullAddress: city.fullAddress,
                  };
                  getWeather(
                    false,
                    city.lat,
                    city.lon,
                    city.name,
                    city.country,
                  );
                });

                suggestionsBox.appendChild(suggestionItem);
              });
            } else {
              suggestionsBox.innerHTML =
                '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">No results found</div>';
            }
          } catch (error) {
            console.error("Error fetching suggestions:", error);
            suggestionsBox.innerHTML =
              '<div class="suggestion-item" style="opacity: 0.7; cursor: default; color: #ffcccc;">Error loading suggestions: ' +
              (error ? error.message || error : "Unknown error") +
              "</div>";
          }
        }, 300);
      });

      document.getElementById("city").addEventListener("keydown", function (e) {
        const suggestionsBox = document.getElementById("suggestions-box");
        let items = suggestionsBox.getElementsByClassName("suggestion-item");

        if (e.key === "ArrowDown") {
          e.preventDefault();
          currentFocus++;
          addActive(items);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          currentFocus--;
          addActive(items);
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (suggestionsBox.style.display === "flex" && currentFocus > -1) {
            if (items[currentFocus]) {
              items[currentFocus].click();
            }
          } else {
            getWeather();
          }
        }
      });

      function addActive(items) {
        if (!items || items.length === 0) return;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("active");
      }

      function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove("active");
        }
      }

      async function useCurrentLocation() {
        if (startupInterval) clearInterval(startupInterval);
        if (!navigator.onLine) {
          showMessage(
            "No internet connection",
            "Please check your network settings and try again.",
          );
          return;
        }

        document.getElementById("message-box").style.display = "none";

        if (navigator.geolocation) {
          const btn = document.getElementById("location-btn");
          btn.classList.add("loading-tada");

          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              try {
                const res = await fetch(`/api/weather?action=geo_reverse&lat=${lat}&lon=${lon}`);
                const data = await res.json();
                if (data && data.length > 0) {
                  document.getElementById("city").value = data[0].name;

                  let countryFull = data[0].country || "";
                  if (countryFull && countryFull.length === 2) {
                    try {
                      const regionNames = new Intl.DisplayNames(["en"], {
                        type: "region",
                      });
                      countryFull =
                        regionNames.of(countryFull.toUpperCase()) ||
                        countryFull;
                    } catch (e) {}
                  }

                  let parts = [data[0].name];
                  if (data[0].state && !parts.includes(data[0].state))
                    parts.push(data[0].state);
                  if (countryFull && !parts.includes(countryFull))
                    parts.push(countryFull);

                  window.selectedLocation = {
                    lat: lat,
                    lon: lon,
                    name: data[0].name,
                    country: data[0].country,
                    fullAddress: parts.filter(Boolean).join(",<br>"),
                  };
                  await getWeather(
                    false,
                    lat,
                    lon,
                    data[0].name,
                    data[0].country,
                  );
                } else {
                  showMessage(
                    "Location not found.",
                    "We couldn't map your device's coordinates to a valid city name.",
                  );
                }
              } catch (err) {
                showMessage(
                  "Error finding location.",
                  "A network issue prevented us from looking up your current location.",
                );
              } finally {
                btn.classList.remove("loading-tada");
              }
            },
            (error) => {
              btn.classList.remove("loading-tada");
              if (error.code === 1) {
                showMessage(
                  "Location permission denied",
                  "Your browser is blocking location access. Please allow it in site settings to use service.",
                );
              } else if (error.code === 2 || error.code === 3) {
                showMessage(
                  "Location is disabled or unavailable",
                  "Please enable GPS on your device to use this feature.",
                );
              } else {
                showMessage(
                  "Location error.",
                  "An unknown error occurred while retrieving your location.",
                );
              }
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
          );
        } else {
          showMessage(
            "Geolocation not supported.",
            "Your device or browser doesn't support GPS features.",
          );
        }
      }

      /* Displays an error message box under the search bar. */
      function showMessage(message, reason) {
        const defaultReason =
          "This might be due to a temporary network issue, an invalid entry, or an API limitation.";
        const msgBox = document.getElementById("message-box");
        msgBox.innerHTML = `
                  <div style="display: flex; align-items: flex-start; font-weight: bold; text-align: left;">
                      <i class='bx bx-error-alt' style='font-size: 1.15rem; margin-right: 6px; flex-shrink: 0; margin-top: 2px;'></i>
                      <span style="word-break: break-word; line-height: 1.3;">${message}</span>
                  </div>
                  <div style="font-size: 0.45rem; opacity: 0.75; margin-top: 4px; padding-left: 25px; line-height: 1.3; text-align: left; word-break: break-word;">
                      Why this happens? ${reason || defaultReason}
                  </div>
              `;
        msgBox.style.display = "block";
      }
      function adjustZoom() {
        const box = document.querySelector(".weather-box");

        // Get dimensions directly without expensive DOM cloning
        const targetWidth = box.offsetWidth || 350;
        const targetHeight = 550; // Use baseline 550px measurement for scale calculation

        const isMobile = window.innerWidth <= 480;
        const gapX = isMobile ? 10 : 50;
        const gapY = isMobile ? 10 : 20;
        const scaleX = (window.innerWidth - gapX) / targetWidth;
        const scaleY = (window.innerHeight - gapY) / targetHeight;
        const scale = Math.min(scaleX, scaleY);
        box.style.transform = `scale(${scale})`;
        box.style.height = "auto";

        const visualDiff = box.offsetHeight * scale - box.offsetHeight;
        box.style.marginBottom = `${visualDiff}px`;
      }
      
      // Auto-trigger suggestion box animations without rewriting display toggles
      document.addEventListener("DOMContentLoaded", function () {
        const sBox = document.getElementById("suggestions-box");
        if (sBox) {
          const sObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.attributeName === "style") {
                if (sBox.style.display === "flex" && !sBox.classList.contains("s-open")) {
                  sBox.classList.remove("s-closing");
                  sBox.classList.add("s-open");
                } else if (sBox.style.display === "none" && sBox.classList.contains("s-open")) {
                  sBox.classList.remove("s-open");
                  sBox.classList.add("s-closing");
                  setTimeout(() => {
                    sBox.classList.remove("s-closing");
                  }, 200);
                }
              }
            });
          });
          sObserver.observe(sBox, { attributes: true, attributeFilter: ["style"] });
        }
      });
    </script>
  </body>
</html>

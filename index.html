    <script>
      (function () {
        const scenes = [
          {
            key: "partlycloudy_layer1",
            url: "assets/scenes/partlycloudy_layer1.webp",
            selectors: [
              ".weather-box.partly-cloudy-day .cloud-layer.cloud-1",
              ".weather-box.partly-cloudy-night .cloud-layer.cloud-1",
            ],
            prop: "background-image",
          },
          {
            key: "partlycloudy_layer2",
            url: "assets/scenes/partlycloudy_layer2.webp",
            selectors: [
              ".weather-box.partly-cloudy-day .cloud-layer.cloud-2",
              ".weather-box.partly-cloudy-night .cloud-layer.cloud-2",
            ],
            prop: "background-image",
          },
          {
            key: "mostlycloudy_layer1",
            url: "assets/scenes/mostlycloudy_layer1.webp",
            selectors: [
              ".weather-box.cloudy-day .cloud-layer.cloud-1",
              ".weather-box.cloudy-night .cloud-layer.cloud-1",
            ],
            prop: "background-image",
          },
          {
            key: "mostlycloudy_layer2",
            url: "assets/scenes/mostlycloudy_layer2.webp",
            selectors: [
              ".weather-box.cloudy-day .cloud-layer.cloud-2",
              ".weather-box.cloudy-night .cloud-layer.cloud-2",
            ],
            prop: "background-image",
          },
          {
            key: "overcast_1",
            url: "assets/scenes/overcast_1.webp",
            selectors: [".overcast-cloud-layer.overcast-1"],
            prop: "background-image",
          },
          {
            key: "overcast_2",
            url: "assets/scenes/overcast_2.webp",
            selectors: [".overcast-cloud-layer.overcast-2"],
            prop: "background-image",
          },
          {
            key: "overcast_3",
            url: "assets/scenes/overcast_3.webp",
            selectors: [".overcast-cloud-layer.overcast-3"],
            prop: "background-image",
          },
          {
            key: "lightning_1",
            url: "assets/scenes/lightning_1.webp",
            selectors: [".lightning.lightning-1"],
            prop: "content",
          },
          {
            key: "lightning_2",
            url: "assets/scenes/lightning_2.webp",
            selectors: [".lightning.lightning-2"],
            prop: "content",
          },
          {
            key: "lightning_3",
            url: "assets/scenes/lightning_3.webp",
            selectors: [".lightning.lightning-3"],
            prop: "content",
          },
          {
            key: "lightning_4",
            url: "assets/scenes/lightning_4.webp",
            selectors: [".lightning.lightning-4"],
            prop: "content",
          },
          {
            key: "fog",
            url: "assets/scenes/fog.webp",
            selectors: [".fog-layer.fog-1", ".fog-layer.fog-2"],
            prop: "background-image",
          },
        ];

        let sceneStyleStr = "";
        scenes.forEach((scene) => {
          const storageKey = "scene_" + scene.key;
          const cachedScene = localStorage.getItem(storageKey);
          if (cachedScene) {
            sceneStyleStr +=
              scene.selectors.join(", ") +
              ` { ${scene.prop}: url("${cachedScene}") !important; }\n`;
          } else {
            fetch(scene.url)
              .then((res) => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.blob();
              })
              .then((blob) => {
                const reader = new FileReader();
                reader.onload = function () {
                  try {
                    localStorage.setItem(storageKey, reader.result);
                  } catch (e) {
                    console.warn("LocalStorage quota exceeded for scenes");
                  }
                };
                reader.readAsDataURL(blob);
              })
              .catch((err) => console.warn("Scene fetch failed:", err));
          }
        });

        if (sceneStyleStr) {
          const style = document.createElement("style");
          style.innerHTML = sceneStyleStr;
          document.head.appendChild(style);
        }
      })();
    </script>
    <script>
      window.getCachedAsset = function (url) {
        try {
          if (
            url.includes("assets/icons/") &&
            localStorage.getItem("disableAnimations") === "true"
          ) {
            url = url.replace("assets/icons/", "assets/icons/static/");
          }
          const storageKey = "asset_" + url;
          const cachedAsset = localStorage.getItem(storageKey);

          if (cachedAsset && cachedAsset.startsWith("data:image")) {
            return cachedAsset;
          } else {
            if (!window._assetFetchPromises) window._assetFetchPromises = {};
            if (!window._assetFetchPromises[url]) {
              window._assetFetchPromises[url] = fetch(url)
                .then((res) => {
                  if (!res.ok) throw new Error("Network error");
                  return res.blob();
                })
                .then((blob) => {
                  const reader = new FileReader();
                  reader.onload = function () {
                    try {
                      localStorage.setItem(storageKey, reader.result);
                      document.querySelectorAll("img").forEach((img) => {
                        if (
                          img.getAttribute("src") === url ||
                          img.src.endsWith(url)
                        ) {
                          img.src = reader.result;
                        }
                      });
                    } catch (e) {
                      console.warn("LocalStorage quota exceeded for assets");
                    }
                  };
                  reader.readAsDataURL(blob);
                })
                .catch((err) => {
                  delete window._assetFetchPromises[url];
                  console.warn("Asset fetch failed:", err);
                });
            }
            return url;
          }
        } catch (e) {
          return url;
        }
      };
    </script>

              if (cachedHTML && resultDiv) {

          window.toggleRadarView(true, true);

        const isModalHash = ["#about", "#privacy", "#terms"].includes(hash);
        if (!hash.startsWith("#weather/") && !isModalHash) {
          window.selectedLocation = null;
          if (localStorage.getItem("rememberCity") === "true") {
            const lastCity = localStorage.getItem("lastCity");
            if (lastCity) {
              const cityInput = document.getElementById("city");
              if (cityInput) cityInput.value = lastCity;

                window.currentStartupCity = lastCity;
                fetchStartupCityWeather();

              if (typeof showRandomStartupCity === "function")
                showRandomStartupCity();

          } else {
            if (typeof showRandomStartupCity === "function")
              showRandomStartupCity();

      window.pushAppState = function (hashName) {
        if (window.location.hash !== hashName) {
          window.history.pushState(null, "", hashName);

        if (

        if (
          termsPanel &&

        ) {
          if (typeof toggleTerms === "function") toggleTerms(true);

        if (
          typeof window.toggleRadarView === "function" &&
          window.isRadarView &&
          hash !== "#radar"
        ) {
          window.toggleRadarView(false, true);

        if (hash.startsWith("#weather/")) {
          let hashCity;

            hashCity = decodeURIComponent(hash.replace("#weather/", ""));

            hashCity = hash.replace("#weather/", "");

          const cityInput = document.getElementById("city");

            if (homeResult) homeResult.style.display = "none";

              if (lastWeatherClass) {
                const weatherBox = document.querySelector(".weather-box");
                if (weatherBox) {
                  const disabled =
                    weatherBox.classList.contains("disable-animations");
                  weatherBox.className = `weather-box${disabled ? " disable-animations" : ""}`;
                  lastWeatherClass
                    .split(" ")
                    .forEach((cls) => weatherBox.classList.add(cls));

              }
            } catch (e) {}

            const radarContainer = document.getElementById("radar-container");
            if (radarContainer) radarContainer.style.display = "none";
          } else if (typeof getWeather === "function") {
            getWeather(false, null, null, hashCity);

        } else if (hash === "#about" && typeof toggleAbout === "function") {
          toggleAbout(true);
        } else if (hash === "#privacy" && typeof togglePrivacy === "function") {
          togglePrivacy(true);
        } else if (hash === "#terms" && typeof toggleTerms === "function") {
          toggleTerms(true);
        } else if (
          hash === "#radar" &&
          typeof window.toggleRadarView === "function"
        ) {
          window.toggleRadarView(true, true);
        } else if (hash === "" || hash === "#home") {
          window.selectedLocation = null;
          const cityInput = document.getElementById("city");
          if (cityInput) {
            cityInput.value = "";
            cityInput.blur();
          }

          const suggestionsBox = document.getElementById("suggestions-box");
          if (suggestionsBox) suggestionsBox.innerHTML = "";
          const messageBox = document.getElementById("message-box");
          if (messageBox) messageBox.style.display = "none";

          const radarBtn = document.getElementById("radar-btn");
          if (radarBtn) radarBtn.style.display = "none";

          if (localStorage.getItem("rememberCity") === "true") {

            } else {
              if (typeof showRandomStartupCity === "function")

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const weatherBox = document.querySelector(".weather-box");
        try {
          const lastScale = localStorage.getItem("lastZoomScale");
          if (lastScale && weatherBox) {
            weatherBox.style.transform = `scale(${lastScale})`;
            weatherBox.style.height = "auto";
          }
        } catch (e) {}

        let resizeTimer;
        let lastWidth = window.innerWidth;
        window.addEventListener("resize", () => {
          const isMobile =
            window.innerWidth <= 768 ||
            /Mobi|Android|iPhone/i.test(navigator.userAgent);

          if (isMobile) {
            if (Math.abs(window.innerWidth - lastWidth) < 30) {
              return;
            }
          }

          lastWidth = window.innerWidth;

          if (resizeTimer) clearTimeout(resizeTimer);
          resizeTimer = setTimeout(adjustZoom, 150);
        });

        window.addEventListener("orientationchange", () => {
          setTimeout(() => {
            lastWidth = window.innerWidth;
            adjustZoom();
          }, 200);
        });

        setTimeout(adjustZoom, 100);

        const locationBtn = document.getElementById("location-btn");
        if (locationBtn) {
          locationBtn.addEventListener("click", useCurrentLocation);
        }

        const searchBtn = document.getElementById("search-btn");
        if (searchBtn) {
          searchBtn.addEventListener("click", function () {
            getWeather(false, null, null, null, null, false, true);
          });
        }
      });

      document.getElementById("city").addEventListener("focus", function () {
        document.getElementById("message-box").style.display = "none";
      });

      window.currentAutocompleteRequestId = 0;
      document.getElementById("city").addEventListener("input", function (e) {
        window.selectedLocation = null;
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        const suggestionsBox = document.getElementById("suggestions-box");
        currentFocus = -1;
        document.getElementById("message-box").style.display = "none";

        if (query.length < 2) {
          suggestionsBox.style.display = "none";
          return;
        }

        if (!navigator.onLine) {
          suggestionsBox.innerHTML =
            '<div class="suggestion-item" style="opacity: 0.7; cursor: default; color: #ffcccc;">No internet connection</div>';
          suggestionsBox.style.display = "flex";
          return;
        }

        debounceTimer = setTimeout(async () => {
          const requestId = ++window.currentAutocompleteRequestId;
          if (window.autocompleteAbortController) {
            window.autocompleteAbortController.abort();
          }
          window.autocompleteAbortController = new AbortController();
          const signal = window.autocompleteAbortController.signal;

          if (query.length < 4) {
            suggestionsBox.innerHTML =
              '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">Searching...</div>';
          }
          suggestionsBox.style.display = "flex";

          try {
            let isZip =
              /^(\d{5}|(?:\d{3,7}|[a-z\d]{2,4}\s?[a-z\d]{3}),\s*[a-z]{2})$/i.test(
                query.trim(),
              );
            let isCoord =
              /^([-+]?\d{1,2}(?:\.\d+)?)\s*,\s*([-+]?\d{1,3}(?:\.\d+)?)$/.exec(
                query.trim(),
              );
            const uniqueResults = [];

            const addResult = (
              cityName,
              district,
              admin1,
              country,
              lat,
              lon,
              fullAddress,
              population = 0,
              type = "",
              feature_code = "",
              importance = 0,
            ) => {
              let safeCity = (cityName || "Unknown")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              if (!safeCity || safeCity.toLowerCase() === "unknown") return;

              let safeDistrict = (district || "")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              let safeAdmin = (admin1 || "")
                .replace(/^[,\s\-]+|[,\s\-]+$/g, "")
                .trim();
              let safeCountry = country || "";

              if (safeCountry.length === 2) {
                try {
                  const regionNames = new Intl.DisplayNames(["en"], {
                    type: "region",
                  });
                  safeCountry =
                    regionNames.of(safeCountry.toUpperCase()) || safeCountry;
                } catch (e) {}
              }

              let resolvedFullAddr =
                fullAddress ||
                [safeCity, safeDistrict, safeAdmin, safeCountry]
                  .filter(Boolean)
                  .join(",<br>");

              const lowerCity = safeCity.toLowerCase();
              const lowerQuery = query.toLowerCase();
              const blacklist = [
                "airport",
                "terminal",
                "railway",
                "station",
                "road",
                "street",
                "highway",
                "university",
                "hospital",
                "clinic",
                "school",
                "main road",
                "bus stop",
              ];
              if (
                blacklist.some((word) =>
                  new RegExp(`\\b${word}\\b`).test(lowerCity),
                )
              )
                return;
              if (lowerCity.includes(" from ") && lowerCity.includes(" to "))
                return;

              let score = 0;
              if (lowerCity === lowerQuery) {
                score += 400;
              } else if (lowerCity.startsWith(lowerQuery)) {
                score += 200;
              } else if (lowerCity.includes(lowerQuery)) {
                score += 50;
              }

              if (
                type === "city" ||
                type === "administrative" ||
                feature_code.startsWith("PPL")
              ) {
                score += 150;
                if (
                  feature_code === "PPLC" ||
                  feature_code === "PPLA" ||
                  feature_code === "PPLA2"
                )
                  score += 150;
              } else if (type === "town") {
                score += 50;
              } else if (type === "village") {
                score -= 100;
              } else if (type === "hamlet" || type === "suburb") {
                score -= 200;
              }

              if (population > 0) {
                score += Math.min(300, Math.log10(population) * 40);
              } else if (importance > 0) {
                score += importance * 300;
              }

              const cLat = Number(lat);
              const cLon = Number(lon);
              if (!Number.isFinite(cLat) || !Number.isFinite(cLon)) return;

              const existingIdx = uniqueResults.findIndex((res) => {
                const latDiff = Math.abs(res.lat - cLat);
                const lonDiff = Math.abs(res.lon - cLon);
                const isSameCountry = res.country === safeCountry;
                const isSameAdmin = res.admin1 === safeAdmin;
                return (
                  res.name.toLowerCase() === lowerCity &&
                  ((latDiff < 0.02 && lonDiff < 0.02) ||
                    (isSameCountry &&
                      isSameAdmin &&
                      latDiff < 0.1 &&
                      lonDiff < 0.1))
                );
              });

              if (existingIdx > -1) {
                if (score > uniqueResults[existingIdx].score) {
                  uniqueResults[existingIdx] = {
                    name: safeCity,
                    district: safeDistrict,
                    admin1: safeAdmin,
                    country: safeCountry,
                    lat: cLat,
                    lon: cLon,
                    fullAddress: resolvedFullAddr,
                    score: score,
                  };
                }
              } else {
                uniqueResults.push({
                  name: safeCity,
                  district: safeDistrict,
                  admin1: safeAdmin,
                  country: safeCountry,
                  lat: cLat,
                  lon: cLon,
                  fullAddress: resolvedFullAddr,
                  score: score,
                });
              }
            };

            let primarySuccess = false;

            if (isCoord) {
              const lat = parseFloat(isCoord[1]);
              const lon = parseFloat(isCoord[2]);
              if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                const owmGeoRes = await fetch(
                  window.getWeatherEndpoint("geo_reverse", {
                    lat: lat,
                    lon: lon,
                  }),
                  { signal },
                ).catch((e) => {
                  if (e.name === "AbortError") throw e;
                  return null;
                });

                if (owmGeoRes && owmGeoRes.ok) {
                  const owmGeoData = await owmGeoRes.json();
                  if (owmGeoData && owmGeoData.length > 0) {
                    const loc = owmGeoData[0];
                    let fullAddr = [loc.name, loc.state, loc.country]
                      .filter(Boolean)
                      .join(",<br>");
                    addResult(
                      loc.name,
                      "",
                      loc.state,
                      loc.country,
                      lat,
                      lon,
                      fullAddr,
                      0,
                      "city",
                      "",
                      999,
                    );
                    primarySuccess = true;
                  }
                }
              }
            } else if (isZip) {
              const owmZipRes = await fetch(
                window.getWeatherEndpoint("geo_zip", {
                  zip: encodeURIComponent(query),
                }),
                { signal },
              ).catch((e) => {
                if (e.name === "AbortError") throw e;
                return null;
              });

              if (owmZipRes && owmZipRes.ok) {
                const owmZipData = await owmZipRes.json();
                if (owmZipData && owmZipData.name) {
                  let countryFull = owmZipData.country || "";
                  let fullAddr = [owmZipData.name, query, countryFull]
                    .filter(Boolean)
                    .join(",<br>");
                  addResult(
                    owmZipData.name,
                    "",
                    "",
                    owmZipData.country,
                    owmZipData.lat,
                    owmZipData.lon,
                    fullAddr,
                    10000,
                    "city",
                  );
                  primarySuccess = true;
                }
              }
            } else {
              const omRes = await fetch(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=20&language=en&format=json`,
                { signal },
              ).catch((e) => {
                if (e.name === "AbortError") throw e;
                return null;
              });

              if (omRes && omRes.ok) {
                const omData = await omRes.json();
                if (omData.results && omData.results.length) {
                  omData.results.forEach((city) => {
                    let parts = [city.name];
                    let mandal = city.admin3 || city.admin4 || "";
                    let district = city.admin2 || "";
                    let state = city.admin1 || "";
                    let postcode =
                      city.postcodes && city.postcodes.length > 0
                        ? city.postcodes[0]
                        : "";
                    let countryFull = city.country || "";

                    if (mandal && !parts.includes(mandal)) parts.push(mandal);
                    if (district && !parts.includes(district))
                      parts.push(district);
                    if (state && !parts.includes(state)) {
                      parts.push(postcode ? `${state} ${postcode}` : state);
                    } else if (postcode && !parts.includes(postcode)) {
                      parts.push(postcode);
                    }
                    if (countryFull && !parts.includes(countryFull))
                      parts.push(countryFull);
                    let fullAddr = parts.filter(Boolean).join(",<br>");
                    addResult(
                      city.name,
                      district,
                      city.admin1,
                      city.country || city.country_code,
                      city.latitude,
                      city.longitude,
                      fullAddr,
                      city.population || 0,
                      "",
                      city.feature_code || "",
                    );
                  });
                }

                const bestScore =
                  uniqueResults.length > 0
                    ? Math.max(...uniqueResults.map((r) => r.score))
                    : 0;
                if (uniqueResults.length >= 5 || bestScore >= 800) {
                  primarySuccess = true;
                }
              }
            }

            if (!primarySuccess) {
              const promises = [
                fetch(
                  `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=15`,
                  { signal },
                ),
                fetch(
                  window.getWeatherEndpoint("geo_direct", {
                    q: encodeURIComponent(query),
                    limit: 10,
                  }),
                  { signal },
                ),
              ];

              const [photonRes, owmRes] = await Promise.all(
                promises.map((p) =>
                  p.catch((e) => {
                    if (e.name === "AbortError") throw e;
                    return e;
                  }),
                ),
              );

              if (photonRes && photonRes.ok) {
                const photonData = await photonRes.json();
                if (photonData && photonData.features) {
                  photonData.features.forEach((f) => {
                    const p = f.properties;
                    let cName = p.name || "";
                    if (!cName) return;
                    let district = p.county || "";
                    let state = p.state || "";
                    let country = p.country || "";
                    let parts = [cName];
                    if (district && !parts.includes(district))
                      parts.push(district);
                    if (state && !parts.includes(state)) {
                      parts.push(p.postcode ? `${state} ${p.postcode}` : state);
                    } else if (p.postcode && !parts.includes(p.postcode)) {
                      parts.push(p.postcode);
                    }
                    if (country && !parts.includes(country))
                      parts.push(country);
                    let fullAddr = parts.filter(Boolean).join(",<br>");
                    addResult(
                      cName,
                      district,
                      state,
                      country,
                      f.geometry.coordinates[1],
                      f.geometry.coordinates[0],
                      fullAddr,
                      0,
                      p.type || p.osm_value || "",
                    );
                  });
                }
              }

              if (owmRes && owmRes.ok) {
                const owmData = await owmRes.json();
                if (owmData && owmData.length) {
                  owmData.forEach((city) => {
                    let parts = [city.name];
                    if (city.state && !parts.includes(city.state))
                      parts.push(city.state);
                    if (city.country && !parts.includes(city.country))
                      parts.push(city.country);
                    let fullAddr = parts.filter(Boolean).join(",<br>");
                    addResult(
                      city.name,
                      "",
                      city.state,
                      city.country,
                      city.lat,
                      city.lon,
                      fullAddr,
                      0,
                      "city",
                    );
                  });
                }
              }
            }

            if (requestId !== window.currentAutocompleteRequestId) return;

            uniqueResults.sort((a, b) => b.score - a.score);
            const topResults = uniqueResults.slice(0, 15);

            if (topResults.length > 0) {
              suggestionsBox.innerHTML = "";
              topResults.forEach((city, index) => {
                const suggestionItem = document.createElement("div");
                suggestionItem.className = "suggestion-item";

                const adminInfo = city.admin1 ? `${city.admin1}, ` : "";
                const districtInfo =
                  city.district &&
                  city.district !== city.name &&
                  city.district !== city.admin1
                    ? `${city.district}, `
                    : "";
                const cityName = city.name;
                const subName = `${districtInfo}${adminInfo}${city.country}`;

                const esc =
                  window.escapeHTML ||
                  ((s) =>
                    (s || "").replace(
                      /[&<>'"]/g,
                      (c) =>
                        ({
                          "&": "&amp;",
                          "<": "&lt;",
                          ">": "&gt;",
                          "'": "&#39;",
                          '"': "&quot;",
                        })[c] || c,
                    ));
                const escapedCityName = esc(cityName);
                const escapedSubName = esc(subName);
                const escapedQuery = esc(query);

                const safeQuery = escapedQuery.replace(
                  /[.*+?^${}()|[\]\\]/g,
                  "\\$&",
                );
                const regex = new RegExp(`(${safeQuery})`, "gi");

                const highlightedCity = escapedCityName.replace(
                  regex,
                  "<strong>$1</strong>",
                );
                const highlightedSub = escapedSubName.replace(
                  regex,
                  "<strong>$1</strong>",
                );

                suggestionItem.innerHTML = `
                            <div style="display: flex; align-items: center; gap: 6px;">
                            <i class="ti ti-map-pin-search" style="margin-top: -9px; flex-shrink: 0;"></i>
                            <div style="display: flex; flex-direction: column; min-width: 0;">
                            <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedCity}</div>
                            <div style="font-size: 0.55rem; opacity: 0.7; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${highlightedSub}</div></div></div>
                        `;

                suggestionItem.addEventListener("click", () => {
                  document.getElementById("city").value = city.name;
                  suggestionsBox.style.display = "none";
                  window.selectedLocation = {
                    lat: city.lat,
                    lon: city.lon,
                    name: city.name,
                    country: city.country,
                    fullAddress: city.fullAddress,
                  };
                  getWeather(
                    false,
                    city.lat,
                    city.lon,
                    city.name,
                    city.country,
                    false,
                    true,
                  );
                });

                suggestionsBox.appendChild(suggestionItem);
              });
            } else {
              suggestionsBox.innerHTML =
                '<div class="suggestion-item" style="opacity: 0.7; cursor: default;">No results found</div>';
            }
          } catch (error) {
            if (
              error.name === "AbortError" ||
              String(error).includes("aborted")
            )
              return;
            console.error("Error fetching suggestions:", error);
            suggestionsBox.innerHTML =
              '<div class="suggestion-item" style="opacity: 0.7; cursor: default; color: #ffcccc;">Error loading suggestions: ' +
              (error ? error.message || error : "Unknown error") +
              "</div>";
          }
        }, 300);
      });

      document.getElementById("city").addEventListener("keydown", function (e) {
        const suggestionsBox = document.getElementById("suggestions-box");
        let items = suggestionsBox.getElementsByClassName("suggestion-item");

        if (e.key === "ArrowDown") {
          e.preventDefault();
          currentFocus++;
          addActive(items);
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          currentFocus--;
          addActive(items);
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (suggestionsBox.style.display === "flex" && currentFocus > -1) {
            if (items[currentFocus]) {
              items[currentFocus].click();
            }
          } else {
            getWeather(false, null, null, null, null, false, true);
          }
        }
      });

      function addActive(items) {
        if (!items || items.length === 0) return;
        removeActive(items);
        if (currentFocus >= items.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = items.length - 1;
        items[currentFocus].classList.add("active");
      }

      function removeActive(items) {
        for (let i = 0; i < items.length; i++) {
          items[i].classList.remove("active");
        }
      }

      async function useCurrentLocation() {
        const currentReqId = ++window.locationRequestId;

        if (!navigator.onLine) {
          showMessage(
            "No internet connection",
            "Please check your network settings and try again.",
          );
          return;
        }

        document.getElementById("message-box").style.display = "none";

        if (navigator.geolocation) {
          const btn = document.getElementById("location-btn");
          btn.classList.add("loading-tada");

          navigator.geolocation.getCurrentPosition(
            async (position) => {
              if (window.locationRequestId !== currentReqId) {
                btn.classList.remove("loading-tada");
                return;
              }
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              try {
                const res = await fetch(
                  window.getWeatherEndpoint("geo_reverse", {
                    lat: lat,
                    lon: lon,
                  }),
                );
                const data = await res.json();
                if (window.locationRequestId !== currentReqId) {
                  return;
                }
                if (data && data.length > 0) {
                  document.getElementById("city").value = data[0].name;

                  let countryFull = data[0].country || "";
                  if (countryFull && countryFull.length === 2) {
                    try {
                      const regionNames = new Intl.DisplayNames(["en"], {
                        type: "region",
                      });
                      countryFull =
                        regionNames.of(countryFull.toUpperCase()) ||
                        countryFull;
                    } catch (e) {}
                  }

                  let parts = [data[0].name];
                  if (data[0].state && !parts.includes(data[0].state))
                    parts.push(data[0].state);
                  if (countryFull && !parts.includes(countryFull))
                    parts.push(countryFull);

                  window.selectedLocation = {
                    lat: lat,
                    lon: lon,
                    name: data[0].name,
                    country: data[0].country,
                    fullAddress: parts.filter(Boolean).join(",<br>"),
                  };
                  await getWeather(
                    false,
                    lat,
                    lon,
                    data[0].name,
                    data[0].country,
                    false,
                    true,
                  );
                } else {
                  showMessage(
                    "Location not found.",
                    "We couldn't map your device's coordinates to a valid city name.",
                  );
                }
              } catch (err) {
                showMessage(
                  "Error finding location.",
                  "A network issue prevented us from looking up your current location.",
                );
              } finally {
                btn.classList.remove("loading-tada");
              }
            },
            (error) => {
              if (window.locationRequestId !== currentReqId) return;
              btn.classList.remove("loading-tada");
              if (error.code === 1) {
                showMessage(
                  "Location permission denied",
                  "Your browser is blocking location access. Please allow it in site settings to use service.",
                );
              } else if (error.code === 2 || error.code === 3) {
                showMessage(
                  "Location is disabled or unavailable",
                  "Please enable GPS on your device to use this feature.",
                );
              } else {
                showMessage(
                  "Location error.",
                  "An unknown error occurred while retrieving your location.",
                );
              }
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
          );
        } else {
          showMessage(
            "Geolocation not supported.",
            "Your device or browser doesn't support GPS features.",
          );
        }
      }

      function showMessage(message, reason) {
        const escapeHTML = (str) => {
          if (!str) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
        };
        const defaultReason =
          "This might be due to a temporary network issue, an invalid entry, or an API limitation.";
        const msgBox = document.getElementById("message-box");
        msgBox.innerHTML = `
                  <div style="display: flex; align-items: flex-start; font-weight: bold; text-align: left;">
                      <i class='bx bx-error-alt' style='font-size: 1.15rem; margin-right: 6px; flex-shrink: 0; margin-top: 2px;'></i>
                      <span style="word-break: break-word; line-height: 1.3;">${escapeHTML(message)}</span>
                  </div>
                  <div style="font-size: 0.45rem; opacity: 0.75; margin-top: 4px; padding-left: 25px; line-height: 1.3; text-align: left; word-break: break-word;">
                      Why this happens? ${escapeHTML(reason || defaultReason)}
                  </div>
              `;
        msgBox.style.display = "block";
      }
      let zoomRAF = null;
      function adjustZoom() {
        if (zoomRAF) return;
        zoomRAF = requestAnimationFrame(() => {
          performZoom();
          zoomRAF = null;
        });
      }

      function performZoom() {
        if (window.visualViewport && window.visualViewport.scale !== 1) {
          return;
        }

        const box = document.querySelector(".weather-box");
        if (!box) return;
        const targetWidth = box.offsetWidth || 350;
        const targetHeight = 550;

        const isMobile = window.innerWidth <= 480;
        const gapX = isMobile ? 10 : 50;
        const gapY = isMobile ? 10 : 20;
        const scaleX = (window.innerWidth - gapX) / targetWidth;
        const scaleY = (window.innerHeight - gapY) / targetHeight;
        const scale = Math.min(scaleX, scaleY);

        box.style.transform = `scale(${scale})`;
        box.style.height = "auto";

        try {
          localStorage.setItem("lastZoomScale", scale.toString());
        } catch (e) {}

        const visualDiff = box.offsetHeight * scale - box.offsetHeight;
        box.style.marginBottom = `${visualDiff}px`;
      }

      document.addEventListener("DOMContentLoaded", function () {
        const sBox = document.getElementById("suggestions-box");
        if (sBox) {
          const sObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.attributeName === "style") {
                if (
                  sBox.style.display === "flex" &&
                  !sBox.classList.contains("s-open")
                ) {
                  sBox.classList.remove("s-closing");
                  sBox.classList.add("s-open");
                } else if (
                  sBox.style.display === "none" &&
                  sBox.classList.contains("s-open")
                ) {
                  sBox.classList.remove("s-open");
                  sBox.classList.add("s-closing");
                  setTimeout(() => {
                    sBox.classList.remove("s-closing");
                  }, 400);
                }
              }
            });
          });
          sObserver.observe(sBox, {
            attributes: true,
            attributeFilter: ["style"],
          });
        }
      });
    </script>
  </body>
